<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97A53"/>
      <stop offset="45%" stop-color="#E8A87C"/>
      <stop offset="75%" stop-color="#F3D1A5"/>
      <stop offset="100%" stop-color="#E5B98F"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6"/>
      <stop offset="100%" stop-color="#F39C5E"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8C412C"/>
      <stop offset="100%" stop-color="#5E2718"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B2593C"/>
      <stop offset="100%" stop-color="#7A321E"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="200" height="200" rx="8" fill="url(#skyGrad)"/>

  <!-- Vintage Vinyl Record Grooves Overlay in Corner -->
  <circle cx="200" cy="0" r="140" fill="none" stroke="#662211" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="200" cy="0" r="120" fill="none" stroke="#662211" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="200" cy="0" r="100" fill="none" stroke="#662211" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Big Warm Sun -->
  <circle cx="100" cy="105" r="42" fill="url(#sunGrad)"/>
  <circle cx="100" cy="105" r="48" fill="none" stroke="#FFF2D6" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Birds in Distance -->
  <path d="M45,62 Q52,57 58,62 Q65,57 72,62" fill="none" stroke="#662211" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M68,50 Q73,46 78,50 Q83,46 88,50" fill="none" stroke="#662211" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Rolling Terracotta Hills -->
  <path d="M0,145 Q45,120 110,138 T200,132 L200,200 L0,200 Z" fill="url(#hill2)"/>
  <path d="M0,165 Q60,148 135,160 T200,152 L200,200 L0,200 Z" fill="url(#hill1)"/>

  <!-- Coffee Cup Silhouette by the window -->
  <path d="M142,158 C142,153 146,149 151,149 L165,149 C170,149 174,153 174,158 L172,176 C171,180 167,183 162,183 L154,183 C149,183 145,180 144,176 Z" fill="#FFF2D6" fill-opacity="0.9"/>
  <!-- Handle -->
  <path d="M173,156 C178,156 182,160 182,165 C182,170 177,173 172,173" fill="none" stroke="#FFF2D6" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Steam -->
  <path d="M152,143 Q155,138 152,133 Q149,128 152,123" fill="none" stroke="#FFF2D6" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.75"/>
  <path d="M162,142 Q165,137 162,132 Q159,127 162,122" fill="none" stroke="#FFF2D6" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.75"/>

  <!-- Vintage Album Header Label -->
  <rect x="14" y="14" width="70" height="15" rx="3" fill="#24120A" fill-opacity="0.85"/>
  <text x="19" y="24.5" font-family="monospace" font-size="7.5" font-weight="900" fill="#FDEBD0" letter-spacing="1">SIDE A • INDIE</text>

  <!-- Title Badge -->
  <rect x="14" y="165" width="112" height="23" rx="3" fill="#FAF5EC" fill-opacity="0.95"/>
  <text x="20" y="176" font-family="sans-serif" font-size="9" font-weight="900" fill="#24120A">LAGU SORE HARI</text>
  <text x="20" y="184.5" font-family="monospace" font-size="6" font-weight="700" fill="#8C412C">NADIN AMIZAH / HINDIA</text>

  <!-- Frame Border -->
  <rect x="2" y="2" width="196" height="196" rx="7" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
</svg>
