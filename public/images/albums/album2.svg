<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="nightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E162B"/>
      <stop offset="50%" stop-color="#38213E"/>
      <stop offset="80%" stop-color="#59304F"/>
      <stop offset="100%" stop-color="#7B3D59"/>
    </linearGradient>
    <linearGradient id="streetGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEBAA" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F1A24"/>
      <stop offset="100%" stop-color="#110D15"/>
    </linearGradient>
  </defs>

  <!-- Base Night Background -->
  <rect width="200" height="200" rx="8" fill="url(#nightGrad)"/>

  <!-- Stars in Night Sky -->
  <circle cx="28" cy="24" r="1" fill="#FFF" opacity="0.8"/>
  <circle cx="56" cy="42" r="1.5" fill="#FFF" opacity="0.9"/>
  <circle cx="92" cy="28" r="1" fill="#FFF" opacity="0.6"/>
  <circle cx="145" cy="38" r="1.2" fill="#FFF" opacity="0.85"/>
  <circle cx="178" cy="22" r="1" fill="#FFF" opacity="0.7"/>
  <circle cx="120" cy="55" r="1.4" fill="#FFD580" opacity="0.9"/>

  <!-- Crescent Moon -->
  <path d="M165,22 A16,16 0 0 0 177,44 A13,13 0 1 1 165,22 Z" fill="#FFEAA7"/>

  <!-- Mountain Silhouettes at Night -->
  <path d="M0,115 Q50,90 100,108 T200,98 L200,200 L0,200 Z" fill="#24152A" opacity="0.7"/>

  <!-- Road converging to horizon -->
  <polygon points="85,130 115,130 170,200 30,200" fill="url(#roadGrad)"/>

  <!-- Road Dashed Center Line -->
  <line x1="100" y1="135" x2="100" y2="148" stroke="#FDE047" stroke-width="1.5" opacity="0.6"/>
  <line x1="100" y1="154" x2="100" y2="172" stroke="#FDE047" stroke-width="2.5" opacity="0.8"/>
  <line x1="100" y1="180" x2="100" y2="200" stroke="#FDE047" stroke-width="3.5" opacity="0.95"/>

  <!-- Streetlight on Side with Glowing Cone -->
  <path d="M135,110 L140,110 L142,165" fill="none" stroke="#6B5976" stroke-width="1.5"/>
  <circle cx="135" cy="110" r="3.5" fill="#FEF08A"/>
  <polygon points="135,110 100,175 160,175" fill="url(#streetGlow)"/>

  <!-- Motorcycle Rear View Mirror Graphic / Silhouette in Foreground -->
  <circle cx="48" cy="155" r="16" fill="#1C1420" stroke="#C084FC" stroke-width="1.5"/>
  <circle cx="48" cy="155" r="13" fill="#2A1C32" opacity="0.8"/>
  <path d="M40,157 Q48,150 56,157" stroke="#F472B6" stroke-width="1.2" fill="none"/>
  <circle cx="48" cy="152" r="2" fill="#FBBF24"/>

  <!-- Vintage Album Header Label -->
  <rect x="14" y="14" width="75" height="15" rx="3" fill="#0E0914" fill-opacity="0.85"/>
  <text x="18" y="24.5" font-family="monospace" font-size="7.5" font-weight="900" fill="#FBCFE8" letter-spacing="1">SIDE B • BALLAD</text>

  <!-- Title Badge -->
  <rect x="14" y="165" width="112" height="23" rx="3" fill="#FAF5EC" fill-opacity="0.95"/>
  <text x="20" y="176" font-family="sans-serif" font-size="9" font-weight="900" fill="#24120A">JALAN PULANG</text>
  <text x="20" y="184.5" font-family="monospace" font-size="6" font-weight="700" fill="#9D174D">YURA YUNITA</text>

  <!-- Frame Border -->
  <rect x="2" y="2" width="196" height="196" rx="7" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2"/>
</svg>
