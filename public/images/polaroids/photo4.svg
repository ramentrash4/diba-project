<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="sunset-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1C38" />
      <stop offset="35%" stop-color="#6E355B" />
      <stop offset="65%" stop-color="#C25953" />
      <stop offset="85%" stop-color="#E88A58" />
      <stop offset="100%" stop-color="#FCD37B" />
    </linearGradient>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF5D6" stop-opacity="1" />
      <stop offset="30%" stop-color="#FED071" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#E87448" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Langit Gradasi Senja Emas -->
  <rect width="400" height="300" fill="url(#sunset-sky)" />

  <!-- Matahari Terbenam Lembut -->
  <circle cx="200" cy="190" r="90" fill="url(#sun-glow)" />
  <circle cx="200" cy="190" r="32" fill="#FFFCE8" />

  <!-- Awan Tipis Keemasan -->
  <ellipse cx="100" cy="140" rx="80" ry="12" fill="#EFA17A" opacity="0.6" />
  <ellipse cx="140" cy="135" rx="50" ry="10" fill="#F8C69D" opacity="0.5" />
  <ellipse cx="290" cy="160" rx="70" ry="11" fill="#EFA17A" opacity="0.6" />
  <ellipse cx="260" cy="155" rx="45" ry="9" fill="#F8C69D" opacity="0.5" />

  <!-- Siluet Bukit-bukit Halus -->
  <path d="M 0 240 Q 110 200 230 235 Q 330 260 400 220 L 400 300 L 0 300 Z" fill="#42202E" />
  <path d="M 0 260 Q 150 230 280 255 Q 360 270 400 250 L 400 300 L 0 300 Z" fill="#26121D" />

  <!-- Siluet Dua Sahabat Memandang Senja -->
  <!-- Sosok 1 (Tatwa) -->
  <ellipse cx="182" cy="216" rx="6" ry="7" fill="#180A12" />
  <path d="M 174 245 L 180 223 L 186 223 L 192 245 Z" fill="#180A12" />
  <!-- Sosok 2 (Adiba / Askiyaa) -->
  <ellipse cx="202" cy="218" rx="5.5" ry="6.5" fill="#180A12" />
  <path d="M 194 245 L 199 224 L 205 224 L 210 245 Z" fill="#180A12" />
  <!-- Kerudung / Rambut siluet -->
  <path d="M 196 222 Q 202 216 208 222 Q 210 230 206 235 L 198 235 Z" fill="#180A12" />

  <!-- Burung-burung Terbang Pulang -->
  <path d="M 110 90 Q 115 82 120 90 Q 125 82 130 90" stroke="#FAF5EC" stroke-width="1.8" fill="none" opacity="0.75" />
  <path d="M 135 105 Q 139 99 143 105 Q 147 99 151 105" stroke="#FAF5EC" stroke-width="1.4" fill="none" opacity="0.65" />
  <path d="M 90 115 Q 93 110 96 115 Q 99 110 102 115" stroke="#FAF5EC" stroke-width="1.2" fill="none" opacity="0.5" />

  <!-- Bintang Senja Pertama Berkedip -->
  <polygon points="320,48 322,54 328,56 322,58 320,64 318,58 312,56 318,54" fill="#FFFBE6" opacity="0.9" />
  <polygon points="80,50 81,54 85,55 81,56 80,60 79,56 75,55 79,54" fill="#FFFBE6" opacity="0.75" />

  <!-- Badge Vintage Overlay -->
  <rect x="15" y="15" width="125" height="24" rx="4" fill="#000000" opacity="0.4" />
  <text x="77" y="31" font-family="monospace" font-size="11" font-weight="bold" fill="#FCE7C8" text-anchor="middle" letter-spacing="1">GOLDEN MEMORY</text>
</svg>
