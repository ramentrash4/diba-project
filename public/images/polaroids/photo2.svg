<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="dining-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A281E" />
      <stop offset="60%" stop-color="#341A12" />
      <stop offset="100%" stop-color="#1F0E0A" />
    </linearGradient>
    <radialGradient id="food-glow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FFD494" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FF9D42" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#dining-bg)" />
  <circle cx="200" cy="180" r="140" fill="url(#food-glow)" />

  <!-- Meja Taplak Kotak-kotak Vintage -->
  <rect x="0" y="190" width="400" height="110" fill="#BD4B39" />
  <!-- Pattern Grid Meja -->
  <path d="M 0 215 L 400 215 M 0 240 L 400 240 M 0 265 L 400 265 M 0 290 L 400 290" stroke="#943324" stroke-width="2" />
  <path d="M 40 190 L 40 300 M 80 190 L 80 300 M 120 190 L 120 300 M 160 190 L 160 300 M 200 190 L 200 300 M 240 190 L 240 300 M 280 190 L 280 300 M 320 190 L 320 300 M 360 190 L 360 300" stroke="#943324" stroke-width="2" />

  <!-- Piring & Mangkuk Makanan Hangat (Ramen / Nasi Goreng Hangat) -->
  <!-- Piring Keramik Putih -->
  <ellipse cx="200" cy="235" rx="75" ry="36" fill="#F4EDE2" stroke="#8C6E52" stroke-width="3" />
  <ellipse cx="200" cy="233" rx="62" ry="28" fill="#E89B38" />
  <!-- Isian / Topping Makanan -->
  <ellipse cx="185" cy="232" rx="20" ry="14" fill="#C95438" />
  <ellipse cx="215" cy="235" rx="16" ry="10" fill="#488249" />
  <ellipse cx="196" cy="226" rx="14" ry="9" fill="#FFF2B8" stroke="#D18928" stroke-width="2" />
  <ellipse cx="196" cy="226" rx="7" ry="5" fill="#E8832A" />

  <!-- Sumpit Bersandar -->
  <line x1="240" y1="205" x2="285" y2="255" stroke="#7A4226" stroke-width="4" stroke-linecap="round" />
  <line x1="248" y1="205" x2="293" y2="255" stroke="#7A4226" stroke-width="4" stroke-linecap="round" />

  <!-- Gelas Minuman Manis Dingin dengan Sedotan -->
  <rect x="75" y="195" width="34" height="50" rx="4" fill="#FCEAC7" opacity="0.85" stroke="#9C7756" stroke-width="2" />
  <rect x="79" y="210" width="26" height="32" fill="#E07A5F" opacity="0.9" />
  <!-- Es Batu -->
  <rect x="83" y="218" width="8" height="8" rx="2" fill="#FFF" opacity="0.6" />
  <rect x="93" y="226" width="7" height="7" rx="2" fill="#FFF" opacity="0.6" />
  <!-- Sedotan Melengkung -->
  <path d="M 92 180 L 92 195 L 88 230" stroke="#FF6B6B" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Uap Hangat Membumbung -->
  <path d="M 185 210 Q 180 185 190 160 Q 200 135 185 110" stroke="#FFF7ED" stroke-width="2.2" fill="none" opacity="0.6" stroke-linecap="round" />
  <path d="M 215 215 Q 225 190 215 165 Q 205 140 220 115" stroke="#FFF7ED" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round" />

  <!-- Doodle Muka Cemberut Lucu (Meme Hangry Diba) -->
  <circle cx="325" cy="95" r="32" fill="#FFE2B8" stroke="#7C4B27" stroke-width="2.5" />
  <!-- Mata Cemberut -->
  <line x1="312" y1="90" x2="320" y2="88" stroke="#522C12" stroke-width="3" stroke-linecap="round" />
  <line x1="330" y1="88" x2="338" y2="90" stroke="#522C12" stroke-width="3" stroke-linecap="round" />
  <!-- Mulut Cemberut Lucu -->
  <path d="M 318 108 Q 325 102 332 108" stroke="#522C12" stroke-width="3" fill="none" stroke-linecap="round" />
  <!-- Pipi Merah -->
  <ellipse cx="313" cy="98" rx="4" ry="2.5" fill="#FF8C8C" opacity="0.8" />
  <ellipse cx="337" cy="98" rx="4" ry="2.5" fill="#FF8C8C" opacity="0.8" />
  <text x="325" y="140" font-family="sans-serif" font-size="9.5" font-weight="900" fill="#FFD29E" text-anchor="middle">HANGRY MODE</text>

  <!-- Badge Vintage Overlay -->
  <rect x="15" y="15" width="105" height="24" rx="4" fill="#000000" opacity="0.4" />
  <text x="67" y="31" font-family="monospace" font-size="11" font-weight="bold" fill="#FCE7C8" text-anchor="middle" letter-spacing="1">DINNER TIME</text>
</svg>
